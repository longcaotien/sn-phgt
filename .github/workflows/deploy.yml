name: Deploy to GitHub Pages

# LƯU Ý: Workflow này dùng GitHub Actions để deploy Pages.
# Trước lần chạy đầu tiên, cần bật Pages trong cài đặt repo:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions" → Save
# Nếu chưa bật, job "deploy" sẽ lỗi 404: "Failed to create deployment ...
# Ensure GitHub Pages has been enabled".
# Site sẽ live tại: https://longcaotien.github.io/sn-phgt/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        # Supabase URL + anon key là CÔNG KHAI (nằm trong bundle là bình thường,
        # RLS mới là thứ bảo vệ dữ liệu). Đặt ở Settings → Secrets and variables
        # → Actions. Thiếu biến thì web vẫn chạy nhưng KHÔNG có cổng đăng nhập.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
