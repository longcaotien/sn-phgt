name: Deploy Edge Functions

# Deploy 2 function lên Supabase, không cần cài Node/CLI ở máy.
#
# Cần đúng 1 secret: SUPABASE_ACCESS_TOKEN
#   Lấy ở https://supabase.com/dashboard/account/tokens → Generate new token
#   Rồi thêm vào repo: Settings → Secrets and variables → Actions
#
# verify_jwt được đọc từ supabase/config.toml:
#   gemini     → false (khách chưa đăng nhập vẫn gọi được)
#   gemini-key → true  (chỉ admin)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Kiểm tra secret
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::Thiếu secret SUPABASE_ACCESS_TOKEN. Thêm ở Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # --project-ref dùng thẳng, không cần `supabase link` (thứ đòi mật khẩu DB)
          supabase functions deploy gemini     --project-ref erzzhvoeltrovuvyufph
          supabase functions deploy gemini-key --project-ref erzzhvoeltrovuvyufph
